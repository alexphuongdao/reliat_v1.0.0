[project]
name = "reliat-backend"
version = "1.0.0"
description = "Reliat — mining outlier substrate. FastAPI + SQLAlchemy."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "alembic>=1.13",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    # Auth: Argon2id hashing, OAuth/OIDC client, and the signed-cookie
    # middleware Authlib needs to carry OAuth state across the redirect.
    "argon2-cffi>=23.1",
    "authlib>=1.3",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
xls = ["xlrd>=2.0"]
dev = ["ruff>=0.6", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
