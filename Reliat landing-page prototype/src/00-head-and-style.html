<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Sora:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  :root{--night:#071418;--night-deep:#050d12;--navy:#0b1825;--surface:#102428;--surface-2:#14312d;--ink:#f2f1e8;--muted:#a9bbb6;--quiet:#6f8882;--green:#72b798;--green-bright:#a9db9f;--line:rgba(175,211,198,.17);--blue:#68a9b3}
  html,body{margin:0;padding:0;background:var(--night);color:var(--ink);font-family:'Sora',system-ui,sans-serif;font-weight:400;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  h1,h2{font-family:'Sora',system-ui,sans-serif;font-weight:300!important;letter-spacing:-.025em!important}
  a{color:#218157;text-decoration:none}
  a:hover{color:#1F41BB}
  ::selection{background:#C1FF72;color:#101728}
  @keyframes rdot{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
  [data-root]{isolation:isolate;background:var(--night)!important}
  [data-mine-track]{position:relative;height:100vh;height:100svh;background:transparent}
  [data-mine-pin]{position:fixed;top:0;left:0;width:100%;height:100vh;height:100svh;overflow:hidden;background:#171713;isolation:isolate;z-index:0;pointer-events:none}
  [data-mine-video]{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;z-index:1;transform:scale(1.002);will-change:transform}
  [data-mine-shade]{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(90deg,rgba(6,10,15,.76) 0%,rgba(6,10,15,.5) 27%,rgba(6,10,15,.08) 62%,rgba(6,10,15,.12) 100%),linear-gradient(0deg,rgba(6,10,15,.5) 0%,transparent 42%,rgba(6,10,15,.12) 100%)}
  [data-mine-copy]{position:absolute;z-index:3;left:8vw;top:50%;width:min(760px,55vw);transform:translateY(-46%);color:#fffdf4;will-change:opacity,transform}
  [data-mine-kicker],[data-mine-scroll]{font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.2em}
  [data-mine-kicker]{display:flex;align-items:center;gap:12px;margin-bottom:19px;font-size:11px;color:#C1FF72}
  [data-mine-kicker]::before{content:"";display:block;width:34px;height:1px;background:#C1FF72}
  [data-mine-copy] h1{max-width:720px;margin:0;font-size:clamp(48px,4.7vw,74px);font-weight:300!important;line-height:.98;letter-spacing:-.045em!important;text-wrap:balance;text-shadow:0 3px 34px rgba(0,0,0,.2)}
  [data-mine-scroll]{position:absolute;z-index:3;left:8vw;bottom:34px;display:flex;align-items:center;gap:12px;font-size:9px;color:rgba(255,253,244,.78);will-change:opacity}
  [data-mine-scroll] i{position:relative;display:block;width:44px;height:1px;background:rgba(255,253,244,.42);overflow:hidden}
  [data-mine-scroll] i::after{content:"";position:absolute;inset:0;background:#C1FF72;transform:translateX(-100%);animation:mine-scroll-line 1.8s ease-in-out infinite}
  [data-mine-transition]{position:absolute;inset:0;z-index:4;pointer-events:none;background:rgba(5,13,18,.98);opacity:0;will-change:opacity}
  @keyframes mine-scroll-line{0%{transform:translateX(-100%)}55%,100%{transform:translateX(100%)}}
  [data-hero-kicker]{padding-left:max(0px,calc(165px - 8vw))}
  [data-topology-plate]{background:#fffdf4;border:1px solid rgba(16,23,40,.18);box-shadow:0 22px 60px -48px rgba(16,23,40,.36)}
  [data-topology-grid]{display:grid;grid-template-columns:1.75fr .75fr;gap:0;align-items:stretch}
  [data-topo] svg{display:block;width:100%;height:auto}
  [data-topology-facts]{border-left:1px solid rgba(16,23,40,.14);padding:24px 0 18px 28px}
  [data-fact-block]{padding:18px 0;border-top:1px solid rgba(16,23,40,.12)}
  [data-fact-block]:first-child{padding-top:0;border-top:0}
  [data-asset-line]{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:baseline;padding:5px 0;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#260E69}
  [data-evidence-heading]{display:grid;grid-template-columns:minmax(420px,1fr) minmax(280px,.55fr);gap:48px;align-items:end;max-width:1400px;margin:0 0 26px}
  [data-evidence-heading] h2{font-size:clamp(34px,3.5vw,54px);line-height:1.01;margin:12px 0 0}
  .evidence-kicker,.evidence-label-row,.evidence-meta-key{font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.16em}
  .evidence-kicker{font-size:11px;color:#218157}
  .evidence-kicker span{color:rgba(16,23,40,.34);padding:0 7px}
  .evidence-intro{max-width:420px;padding:0 0 4px 24px;border-left:1px solid rgba(16,23,40,.22);font-size:13px;line-height:1.65;color:rgba(16,23,40,.67)}
  [data-evidence-frame]{max-width:1400px;border:1px solid rgba(16,23,40,.25);background:rgba(255,253,244,.58);box-shadow:0 24px 70px -60px rgba(16,23,40,.48);overflow:hidden;opacity:0}
  [data-evidence-meta]{min-height:45px;display:grid;grid-template-columns:1fr 1fr 1fr 1.25fr;border-bottom:1px solid rgba(16,23,40,.22);font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.07em}
  [data-evidence-meta]>div{display:flex;align-items:center;gap:10px;padding:0 16px;border-left:1px solid rgba(16,23,40,.14);white-space:nowrap}
  [data-evidence-meta]>div:first-child{border-left:0}
  .evidence-meta-key{font-size:8px;color:rgba(16,23,40,.46)}
  [data-evidence-meta] strong{font-size:10px;font-weight:500;color:#260E69}
  [data-evidence-meta] .evidence-verdict{justify-content:flex-end;color:#260E69;font-size:9px;letter-spacing:.12em}
  .evidence-verdict i{display:block;width:6px;height:6px;background:#218157;border-radius:50%;box-shadow:0 0 0 4px rgba(33,129,87,.10)}
  [data-evgrid]{display:grid;grid-template-columns:1.12fr 1fr 1fr;grid-template-rows:repeat(2,minmax(134px,1fr));min-height:310px}
  [data-ev]{position:relative;min-width:0;padding:18px 20px;background:transparent;opacity:0;overflow:hidden}
  [data-ev-rule]{position:absolute;top:0;left:0;width:100%;height:2px;background:#218157;transform:scaleX(0);transform-origin:left center}
  [data-ev-primary]{grid-row:1 / 3;padding:22px 26px 19px;border-right:1px solid rgba(16,23,40,.2)}
  [data-ev-compact]{border-left:1px solid rgba(16,23,40,.13)}
  [data-ev="04"],[data-ev="05"]{border-top:1px solid rgba(16,23,40,.16)}
  .evidence-label-row{display:flex;justify-content:space-between;gap:16px;font-size:8.5px;color:#1F41BB}
  .evidence-label-row span:last-child{color:rgba(16,23,40,.42)}
  .evidence-primary-title{font-size:14px;font-weight:500;margin-top:19px}
  .evidence-primary-reading{display:flex;align-items:baseline;margin:1px 0 7px;font-family:'IBM Plex Mono',monospace}
  .evidence-value{font-family:'Sora',sans-serif;font-size:clamp(52px,5.5vw,78px);font-weight:200;letter-spacing:-.075em;line-height:1}
  .evidence-unit{font-size:17px;color:#1F41BB;margin-left:6px}
  .evidence-delta{font-size:11px;color:#218157;margin-left:auto}
  [data-ev-primary] [data-spark]{height:64px;margin:2px 0 13px}
  .evidence-baseline{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:8px 12px;padding-top:11px;border-top:1px solid rgba(16,23,40,.14);font-family:'IBM Plex Mono',monospace;font-size:9px}
  .evidence-baseline span{color:rgba(16,23,40,.44);letter-spacing:.09em}
  .evidence-baseline strong{font-weight:500;color:#260E69}
  .evidence-compact-body{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end;margin:14px 0 5px}
  .evidence-compact-title{font-size:13px;font-weight:500;line-height:1.25}
  .evidence-note{font-size:9px;color:rgba(16,23,40,.52);margin-top:4px;white-space:nowrap}
  .evidence-compact-reading{display:flex;align-items:baseline;gap:5px;font-family:'IBM Plex Mono',monospace;color:#260E69;white-space:nowrap}
  .evidence-compact-reading strong{font-family:'Sora',sans-serif;font-size:25px;font-weight:300;letter-spacing:-.05em}
  .evidence-compact-reading span{font-size:9px;color:#218157}
  [data-ev-compact] [data-spark]{height:30px}
  [data-spark] svg{overflow:visible}
  [data-hyp-heading]{display:grid;grid-template-columns:minmax(480px,1fr) minmax(300px,.55fr);gap:48px;align-items:end;max-width:1400px;margin:0 0 24px}
  [data-hyp-heading] h2{font-size:clamp(34px,3.5vw,54px);line-height:1.01;margin:12px 0 0}
  .hyp-kicker,.hyp-meta-key,.hyp-evidence-label,[data-hyp-rank] span,[data-hyp-rank] em,[data-hyp-score] em,.hyp-confidence-label{font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.14em}
  .hyp-kicker{font-size:11px;color:#218157}
  .hyp-kicker span{color:rgba(16,23,40,.34);padding:0 7px}
  .hyp-intro{max-width:440px;padding:0 0 4px 24px;border-left:1px solid rgba(16,23,40,.22);font-size:13px;line-height:1.65;color:rgba(16,23,40,.67)}
  [data-hypgrid]{max-width:1400px;border:1px solid rgba(16,23,40,.25);background:rgba(255,253,244,.58);box-shadow:0 24px 70px -60px rgba(16,23,40,.48);overflow:hidden;opacity:0}
  [data-hyp-meta]{min-height:44px;display:grid;grid-template-columns:1.15fr 1fr .75fr 1.25fr;border-bottom:1px solid rgba(16,23,40,.22);font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.07em}
  [data-hyp-meta]>div{display:flex;align-items:center;gap:10px;padding:0 16px;border-left:1px solid rgba(16,23,40,.14);white-space:nowrap}
  [data-hyp-meta]>div:first-child{border-left:0}
  .hyp-meta-key{font-size:8px;color:rgba(16,23,40,.44)}
  [data-hyp-meta] strong{font-size:9.5px;font-weight:500;color:#260E69}
  [data-hyp-meta] .hyp-next-check{justify-content:flex-end;color:#260E69;font-size:9px}
  .hyp-next-check span{color:#218157}
  [data-hyp]{position:relative;display:grid;grid-template-columns:74px minmax(255px,.9fr) minmax(500px,1.65fr) 92px;gap:22px;align-items:center;min-height:126px;padding:17px 20px 17px 0;border-top:1px solid rgba(16,23,40,.15);background:transparent;opacity:0;overflow:hidden}
  [data-hyp]:first-of-type{border-top:0}
  [data-hyp-primary]{min-height:150px;background:rgba(255,255,255,.2)}
  [data-hyp-accent]{position:absolute;left:0;top:0;width:3px;height:100%;background:rgba(31,65,187,.24);transform:scaleY(0);transform-origin:center top}
  [data-hyp-primary] [data-hyp-accent]{background:#218157}
  [data-hyp-rank]{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid rgba(16,23,40,.13);font-style:normal}
  [data-hyp-rank] span{font-size:7.5px;color:rgba(16,23,40,.42)}
  [data-hyp-rank] strong{font-family:'Sora',sans-serif;font-size:32px;font-weight:200;letter-spacing:-.05em;color:#1F41BB;line-height:1.15}
  [data-hyp-primary] [data-hyp-rank] strong{color:#218157}
  [data-hyp-rank] em{font-size:7px;color:rgba(16,23,40,.44);font-style:normal}
  [data-hyp-summary]{min-width:0}
  .hyp-title{font-size:17px;font-weight:500;line-height:1.2;margin-bottom:5px}
  [data-hyp-summary]>p{font-size:11.5px;line-height:1.45;color:rgba(38,14,105,.72);margin:0 0 12px;max-width:390px}
  .hyp-confidence-label{display:flex;justify-content:space-between;margin-bottom:5px;font-size:7.5px;color:rgba(16,23,40,.45)}
  .hyp-confidence-label strong{font-weight:500;color:#260E69}
  .hyp-confidence-track{height:2px;background:rgba(16,23,40,.10);overflow:hidden}
  .hyp-confidence-track [data-conf]{height:100%;width:0;background:rgba(31,65,187,.38)}
  [data-hyp-primary] .hyp-confidence-track [data-conf]{background:#218157}
  [data-hyp-evidence]{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;align-self:stretch}
  [data-hyp-detail]{padding:5px 18px;border-left:1px solid rgba(16,23,40,.12);opacity:0}
  [data-hyp-detail]:first-child{border-left:0}
  .hyp-evidence-label{font-size:7.5px;margin-bottom:8px;color:#260E69}
  .hyp-evidence-label.support{color:#218157}
  .hyp-evidence-label.conflict{color:#1F41BB}
  .hyp-evidence-label.missing{color:#260E69}
  [data-hyp-detail] p{font-size:10.5px;line-height:1.55;color:rgba(38,14,105,.82);margin:0}
  [data-hyp-score]{display:flex;align-items:baseline;justify-content:flex-end;align-self:start;padding-top:4px;font-family:'IBM Plex Mono',monospace;color:#260E69;white-space:nowrap}
  [data-hyp-score] strong{font-family:'Sora',sans-serif;font-size:35px;font-weight:200;letter-spacing:-.06em}
  [data-hyp-score] span{font-size:10px;margin-left:3px;color:#1F41BB}
  [data-hyp-score] em{position:absolute;right:20px;bottom:17px;font-size:7px;font-style:normal;color:rgba(16,23,40,.42)}
  [data-hyp-primary] [data-hyp-score] strong,[data-hyp-primary] [data-hyp-score] span{color:#218157}

  /* Reliat night system — the footage carries the light; the interface recedes. */
  [data-layout="vertical"] [data-track]{position:relative;z-index:1;background:transparent!important}
  [data-layout="vertical"] [data-pin],[data-layout="vertical"] [data-world]{background:transparent!important}
  [data-layout="vertical"] [data-scene]{background:rgba(7,20,24,.64)!important;border-top:1px solid rgba(175,211,198,.12)!important}
  [data-layout="vertical"] [data-scene]:nth-child(even){background:rgba(5,16,20,.72)!important}
  [data-layout="vertical"] [data-belt-video],
  [data-layout="vertical"] [data-belt-video-next],
  [data-layout="vertical"] [data-belt-grade],
  [data-layout="vertical"] [data-belt-size-mobile]{display:none!important}
  [data-layout="vertical"] [data-scene="1"]{display:flex!important;flex-direction:column;justify-content:center;overflow:visible}
  [data-layout="vertical"] [data-scene="1"] [data-copy]:last-child{margin-top:auto!important;padding-top:44px}
  [data-layout="vertical"] [data-scene="2"]>[data-copy]{max-width:680px!important}
  [data-layout="vertical"] [data-copy="cta"]{min-height:min(720px,82svh)}
  [data-chrome]{color:var(--ink)}
  [data-progress-wrap]{background:rgba(218,235,229,.16)!important}
  [data-progress]{background:var(--green)!important}
  [data-header-cta],[data-platform-link]{background:#1b7659!important;color:#f7f6ed!important;box-shadow:0 8px 28px rgba(0,0,0,.18)}
  [data-chip]{background:rgba(9,27,28,.94)!important;border-color:rgba(114,183,152,.62)!important;box-shadow:0 18px 40px -22px rgba(0,0,0,.8)!important}
  [data-chip] span:last-child{color:var(--ink)!important}
  [data-world] h1,[data-world] h2,[data-world] h3,[data-world] strong{color:var(--ink)}
  [data-world] [data-copy]{z-index:3}
  [data-world] p{color:var(--muted)!important}
  [data-world] [style*="color:#260E69"]{color:var(--muted)!important}
  [data-world] [style*="color:#1F41BB"]{color:var(--blue)!important}
  [data-world] [style*="color:#218157"]{color:var(--green-bright)!important}
  [data-world] [style*="background:#C1FF72"]{background:rgba(73,139,107,.2)!important;color:var(--ink)!important;border:1px solid rgba(169,219,159,.26)}
  [data-world] [style*="background:#fffdf4"],[data-world] [style*="background:#fbf7e6"]{background:rgba(13,35,37,.9)!important}
  [data-world] [style*="border:1px solid rgba(31,65,187"]{border-color:var(--line)!important}
  [data-world] [style*="border-bottom:1px solid rgba(31,65,187"]{border-color:var(--line)!important}

  [data-scene="1"]{overflow:hidden;background:var(--night-deep)}
  [data-belt-video],[data-belt-video-next]{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;z-index:0;display:block;filter:saturate(.68) contrast(1.09) brightness(.7);transform:scaleX(-1) scale(1.012);will-change:transform,opacity}
  [data-belt-video-next]{opacity:0}
  [data-belt-grade]{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(4,13,18,.9) 0%,rgba(5,18,22,.68) 31%,rgba(5,17,20,.16) 64%,rgba(4,13,18,.38) 100%),linear-gradient(0deg,rgba(5,14,18,.7) 0%,rgba(5,14,18,.08) 43%,rgba(6,18,22,.55) 100%)}
  [data-scene="1"] [data-copy]{z-index:3;color:var(--ink);text-shadow:0 2px 24px rgba(0,0,0,.28)}
  [data-scene="1"] [data-copy] p{color:rgba(242,241,232,.75)!important}
  [data-scene="1"] [data-copy]:last-child{color:rgba(214,232,225,.75)!important}
  [data-belt-size-mobile]{display:none}

  [data-evidence-frame],[data-hypgrid],[data-topology-plate]{background:rgba(13,34,37,.82);border-color:var(--line);box-shadow:0 30px 80px -54px rgba(0,0,0,.9)}
  [data-evidence-meta],[data-hyp-meta],[data-ev-primary],[data-ev-compact],[data-hyp],[data-hyp-rank],[data-hyp-detail],[data-topology-facts],[data-fact-block]{border-color:var(--line)!important}
  [data-hyp-primary]{background:rgba(80,145,116,.08)}
  .evidence-intro,.hyp-intro{color:var(--muted);border-color:rgba(175,211,198,.26)}
  .evidence-kicker span,.hyp-kicker span,.evidence-meta-key,.hyp-meta-key,.evidence-label-row span:last-child,.evidence-note,[data-hyp-rank] span,[data-hyp-rank] em,.hyp-confidence-label,[data-hyp-score] em{color:var(--quiet)}
  [data-evidence-meta] strong,[data-hyp-meta] strong,.evidence-baseline strong,.evidence-compact-reading,.hyp-confidence-label strong,.hyp-evidence-label,[data-hyp-score]{color:var(--ink)}
  .hyp-confidence-track{background:rgba(218,235,229,.12)}
  [data-topology-plate]{background:rgba(10,29,32,.88)}
  [data-copy="artifact"]{max-width:min(1320px,88vw)!important}
  [data-artifact-frame]{position:relative;margin:0;border:1px solid rgba(145,203,181,.24);border-radius:16px;overflow:hidden;background:#151c24;box-shadow:0 34px 90px -38px rgba(0,0,0,.92),0 0 0 1px rgba(5,15,19,.72)}
  [data-artifact-frame]::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(235,244,239,.04),inset 0 -72px 90px -90px rgba(83,198,174,.35)}
  [data-artifact-image]{display:block;width:100%;height:auto}
  [data-copy="cta"]{background:rgba(5,15,19,.97)!important}
  [data-copy="cta"] p{color:var(--muted)!important}
  [data-scene="6"] button[style*="background:transparent"]{color:var(--muted)!important;border-color:rgba(175,211,198,.25)!important}

  /* Inline prototype colors are normalized here so no legacy purple survives. */
  [data-world] [data-scene],[data-world] [data-scene] *{color:var(--ink)!important}
  [data-world] [data-scene] p,
  .evidence-intro,.hyp-intro,
  [data-hyp-summary]>p,[data-hyp-detail] p,
  [data-topology-facts] [data-fact-block]>div:last-child{color:var(--muted)!important}
  [data-mine-kicker],
  [data-scene="1"] [data-copy]>div:first-child,
  [data-scene="2"] [data-copy]>div:first-child,
  .evidence-kicker,.hyp-kicker,
  [data-copy="artifact"]>div:first-child,
  [data-copy="cta"]>div:first-child{color:var(--green)!important}
  .evidence-kicker span,.hyp-kicker span,
  .evidence-meta-key,.hyp-meta-key,
  .evidence-label-row span:last-child,.evidence-note,
  [data-hyp-rank] span,[data-hyp-rank] em,
  .hyp-confidence-label,[data-hyp-score] em{color:var(--quiet)!important}
  .evidence-label-row,.evidence-unit,
  .hyp-evidence-label.conflict,[data-hyp-rank] strong,
  [data-hyp-score] span{color:var(--blue)!important}
  .evidence-delta,.evidence-compact-reading span,
  .hyp-evidence-label.support,
  [data-hyp-primary] [data-hyp-rank] strong,
  [data-hyp-primary] [data-hyp-score] strong,
  [data-hyp-primary] [data-hyp-score] span,
  [data-evidence-meta] .evidence-verdict,
  [data-hyp-meta] .hyp-next-check span,
  [data-asset-line] span:first-child,
  [data-topology-facts] [data-fact-block]:first-child span:nth-child(even){color:var(--green)!important}
  .hyp-evidence-label.missing{color:var(--quiet)!important}
  [data-asset-line]{color:var(--muted)!important}
  [data-scene="1"] [data-copy] p{color:rgba(242,241,232,.75)!important}
  [data-scene="1"] [data-copy]:last-child{color:rgba(214,232,225,.75)!important}
  [data-scene="6"] button[style*="background: transparent"]{color:var(--muted)!important;border-color:rgba(175,211,198,.25)!important}

  /* Editorial polish for the evidence, root-cause, and propagation chapters. */
  [data-scene="3"] h2,[data-scene="4"] h2,[data-scene="5"] h2{
    font-size:clamp(42px,4.1vw,62px)!important;
    font-weight:400!important;
    line-height:1.015!important;
    letter-spacing:-.032em!important
  }
  [data-scene="6"] h2{font-weight:400!important;letter-spacing:-.032em!important}
  .evidence-kicker,.hyp-kicker,[data-copy="topo"]>div:first-child{
    font-size:12px!important;
    font-weight:500!important
  }
  .evidence-intro,.hyp-intro{
    max-width:470px;
    font-size:14.5px;
    font-weight:400;
