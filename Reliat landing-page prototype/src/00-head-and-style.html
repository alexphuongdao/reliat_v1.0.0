<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Sora:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#fff8e7;color:#101728;font-family:'Sora',system-ui,sans-serif;font-weight:400;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  h1,h2{font-family:'Sora',system-ui,sans-serif;font-weight:300!important;letter-spacing:-.025em!important}
  a{color:#218157;text-decoration:none}
  a:hover{color:#1F41BB}
  ::selection{background:#C1FF72;color:#101728}
  @keyframes rdot{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
  [data-hero-kicker]{padding-left:max(0px,calc(165px - 8vw))}
  [data-topology-plate]{background:#fffdf4;border:1px solid rgba(16,23,40,.18);box-shadow:0 22px 60px -48px rgba(16,23,40,.36)}
  [data-topology-grid]{display:grid;grid-template-columns:1.75fr .75fr;gap:0;align-items:stretch}
  [data-topo] svg{display:block;width:100%;height:auto}
  [data-topology-facts]{border-left:1px solid rgba(16,23,40,.14);padding:24px 0 18px 28px}
  [data-fact-block]{padding:18px 0;border-top:1px solid rgba(16,23,40,.12)}
  [data-fact-block]:first-child{padding-top:0;border-top:0}
  [data-asset-line]{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:baseline;padding:5px 0;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#260E69}
  [data-evidence-heading]{display:grid;grid-template-columns:minmax(420px,1fr) minmax(280px,.55fr);gap:48px;align-items:end;max-width:1400px;margin:0 0 26px}
  [data-evidence-heading] h2{font-size:clamp(34px,3.5vw,54px);line-height:1.01;margin:12px 0 0}
  .evidence-kicker,.evidence-label-row,.evidence-meta-key{font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.16em}
  .evidence-kicker{font-size:11px;color:#218157}
  .evidence-kicker span{color:rgba(16,23,40,.34);padding:0 7px}
  .evidence-intro{max-width:420px;padding:0 0 4px 24px;border-left:1px solid rgba(16,23,40,.22);font-size:13px;line-height:1.65;color:rgba(16,23,40,.67)}
  [data-evidence-frame]{max-width:1400px;border:1px solid rgba(16,23,40,.25);background:rgba(255,253,244,.58);box-shadow:0 24px 70px -60px rgba(16,23,40,.48);overflow:hidden;opacity:0}
  [data-evidence-meta]{min-height:45px;display:grid;grid-template-columns:1fr 1fr 1fr 1.25fr;border-bottom:1px solid rgba(16,23,40,.22);font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.07em}
  [data-evidence-meta]>div{display:flex;align-items:center;gap:10px;padding:0 16px;border-left:1px solid rgba(16,23,40,.14);white-space:nowrap}
  [data-evidence-meta]>div:first-child{border-left:0}
  .evidence-meta-key{font-size:8px;color:rgba(16,23,40,.46)}
  [data-evidence-meta] strong{font-size:10px;font-weight:500;color:#260E69}
  [data-evidence-meta] .evidence-verdict{justify-content:flex-end;color:#260E69;font-size:9px;letter-spacing:.12em}
  .evidence-verdict i{display:block;width:6px;height:6px;background:#218157;border-radius:50%;box-shadow:0 0 0 4px rgba(33,129,87,.10)}
  [data-evgrid]{display:grid;grid-template-columns:1.12fr 1fr 1fr;grid-template-rows:repeat(2,minmax(134px,1fr));min-height:310px}
  [data-ev]{position:relative;min-width:0;padding:18px 20px;background:transparent;opacity:0;overflow:hidden}
  [data-ev-rule]{position:absolute;top:0;left:0;width:100%;height:2px;background:#218157;transform:scaleX(0);transform-origin:left center}
  [data-ev-primary]{grid-row:1 / 3;padding:22px 26px 19px;border-right:1px solid rgba(16,23,40,.2)}
  [data-ev-compact]{border-left:1px solid rgba(16,23,40,.13)}
  [data-ev="04"],[data-ev="05"]{border-top:1px solid rgba(16,23,40,.16)}
  .evidence-label-row{display:flex;justify-content:space-between;gap:16px;font-size:8.5px;color:#1F41BB}
  .evidence-label-row span:last-child{color:rgba(16,23,40,.42)}
  .evidence-primary-title{font-size:14px;font-weight:500;margin-top:19px}
  .evidence-primary-reading{display:flex;align-items:baseline;margin:1px 0 7px;font-family:'IBM Plex Mono',monospace}
  .evidence-value{font-family:'Sora',sans-serif;font-size:clamp(52px,5.5vw,78px);font-weight:200;letter-spacing:-.075em;line-height:1}
  .evidence-unit{font-size:17px;color:#1F41BB;margin-left:6px}
  .evidence-delta{font-size:11px;color:#218157;margin-left:auto}
  [data-ev-primary] [data-spark]{height:64px;margin:2px 0 13px}
  .evidence-baseline{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:8px 12px;padding-top:11px;border-top:1px solid rgba(16,23,40,.14);font-family:'IBM Plex Mono',monospace;font-size:9px}
  .evidence-baseline span{color:rgba(16,23,40,.44);letter-spacing:.09em}
  .evidence-baseline strong{font-weight:500;color:#260E69}
  .evidence-compact-body{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end;margin:14px 0 5px}
  .evidence-compact-title{font-size:13px;font-weight:500;line-height:1.25}
  .evidence-note{font-size:9px;color:rgba(16,23,40,.52);margin-top:4px;white-space:nowrap}
  .evidence-compact-reading{display:flex;align-items:baseline;gap:5px;font-family:'IBM Plex Mono',monospace;color:#260E69;white-space:nowrap}
  .evidence-compact-reading strong{font-family:'Sora',sans-serif;font-size:25px;font-weight:300;letter-spacing:-.05em}
  .evidence-compact-reading span{font-size:9px;color:#218157}
  [data-ev-compact] [data-spark]{height:30px}
  [data-spark] svg{overflow:visible}
  [data-hyp-heading]{display:grid;grid-template-columns:minmax(480px,1fr) minmax(300px,.55fr);gap:48px;align-items:end;max-width:1400px;margin:0 0 24px}
  [data-hyp-heading] h2{font-size:clamp(34px,3.5vw,54px);line-height:1.01;margin:12px 0 0}
  .hyp-kicker,.hyp-meta-key,.hyp-evidence-label,[data-hyp-rank] span,[data-hyp-rank] em,[data-hyp-score] em,.hyp-confidence-label{font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.14em}
  .hyp-kicker{font-size:11px;color:#218157}
  .hyp-kicker span{color:rgba(16,23,40,.34);padding:0 7px}
  .hyp-intro{max-width:440px;padding:0 0 4px 24px;border-left:1px solid rgba(16,23,40,.22);font-size:13px;line-height:1.65;color:rgba(16,23,40,.67)}
  [data-hypgrid]{max-width:1400px;border:1px solid rgba(16,23,40,.25);background:rgba(255,253,244,.58);box-shadow:0 24px 70px -60px rgba(16,23,40,.48);overflow:hidden;opacity:0}
  [data-hyp-meta]{min-height:44px;display:grid;grid-template-columns:1.15fr 1fr .75fr 1.25fr;border-bottom:1px solid rgba(16,23,40,.22);font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.07em}
  [data-hyp-meta]>div{display:flex;align-items:center;gap:10px;padding:0 16px;border-left:1px solid rgba(16,23,40,.14);white-space:nowrap}
  [data-hyp-meta]>div:first-child{border-left:0}
  .hyp-meta-key{font-size:8px;color:rgba(16,23,40,.44)}
  [data-hyp-meta] strong{font-size:9.5px;font-weight:500;color:#260E69}
  [data-hyp-meta] .hyp-next-check{justify-content:flex-end;color:#260E69;font-size:9px}
  .hyp-next-check span{color:#218157}
  [data-hyp]{position:relative;display:grid;grid-template-columns:74px minmax(255px,.9fr) minmax(500px,1.65fr) 92px;gap:22px;align-items:center;min-height:126px;padding:17px 20px 17px 0;border-top:1px solid rgba(16,23,40,.15);background:transparent;opacity:0;overflow:hidden}
  [data-hyp]:first-of-type{border-top:0}
  [data-hyp-primary]{min-height:150px;background:rgba(255,255,255,.2)}
  [data-hyp-accent]{position:absolute;left:0;top:0;width:3px;height:100%;background:rgba(31,65,187,.24);transform:scaleY(0);transform-origin:center top}
  [data-hyp-primary] [data-hyp-accent]{background:#218157}
  [data-hyp-rank]{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid rgba(16,23,40,.13);font-style:normal}
  [data-hyp-rank] span{font-size:7.5px;color:rgba(16,23,40,.42)}
  [data-hyp-rank] strong{font-family:'Sora',sans-serif;font-size:32px;font-weight:200;letter-spacing:-.05em;color:#1F41BB;line-height:1.15}
  [data-hyp-primary] [data-hyp-rank] strong{color:#218157}
  [data-hyp-rank] em{font-size:7px;color:rgba(16,23,40,.44);font-style:normal}
  [data-hyp-summary]{min-width:0}
  .hyp-title{font-size:17px;font-weight:500;line-height:1.2;margin-bottom:5px}
  [data-hyp-summary]>p{font-size:11.5px;line-height:1.45;color:rgba(38,14,105,.72);margin:0 0 12px;max-width:390px}
  .hyp-confidence-label{display:flex;justify-content:space-between;margin-bottom:5px;font-size:7.5px;color:rgba(16,23,40,.45)}
  .hyp-confidence-label strong{font-weight:500;color:#260E69}
  .hyp-confidence-track{height:2px;background:rgba(16,23,40,.10);overflow:hidden}
  .hyp-confidence-track [data-conf]{height:100%;width:0;background:rgba(31,65,187,.38)}
  [data-hyp-primary] .hyp-confidence-track [data-conf]{background:#218157}
  [data-hyp-evidence]{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;align-self:stretch}
  [data-hyp-detail]{padding:5px 18px;border-left:1px solid rgba(16,23,40,.12);opacity:0}
  [data-hyp-detail]:first-child{border-left:0}
  .hyp-evidence-label{font-size:7.5px;margin-bottom:8px;color:#260E69}
  .hyp-evidence-label.support{color:#218157}
  .hyp-evidence-label.conflict{color:#1F41BB}
  .hyp-evidence-label.missing{color:#260E69}
  [data-hyp-detail] p{font-size:10.5px;line-height:1.55;color:rgba(38,14,105,.82);margin:0}
  [data-hyp-score]{display:flex;align-items:baseline;justify-content:flex-end;align-self:start;padding-top:4px;font-family:'IBM Plex Mono',monospace;color:#260E69;white-space:nowrap}
  [data-hyp-score] strong{font-family:'Sora',sans-serif;font-size:35px;font-weight:200;letter-spacing:-.06em}
  [data-hyp-score] span{font-size:10px;margin-left:3px;color:#1F41BB}
  [data-hyp-score] em{position:absolute;right:20px;bottom:17px;font-size:7px;font-style:normal;color:rgba(16,23,40,.42)}
  [data-hyp-primary] [data-hyp-score] strong,[data-hyp-primary] [data-hyp-score] span{color:#218157}
  @media (max-width:600px){
    [data-chrome]{padding:16px 18px!important}
    [data-chrome-actions]{gap:10px!important}
    [data-progress-wrap]{width:54px!important}
    [data-header-cta]{font-size:10px!important;padding:7px 10px!important}
  }
  @media (max-width:899px){
    [data-hero-kicker]{padding-left:0}
    [data-topology-plate]{padding:18px!important}
    [data-topology-grid]{grid-template-columns:1fr!important}
    [data-topology-facts]{border-left:0;border-top:1px solid rgba(16,23,40,.14);padding:24px 0 0}
    [data-evidence-heading]{grid-template-columns:1fr;gap:18px;margin-bottom:22px}
    .evidence-intro{padding-left:16px}
    [data-evidence-meta]{grid-template-columns:1fr 1fr}
    [data-evidence-meta]>div{min-height:38px;border-top:1px solid rgba(16,23,40,.12)}
    [data-evidence-meta]>div:nth-child(odd){border-left:0}
    [data-evgrid]{grid-template-columns:1fr!important;grid-template-rows:auto}
    [data-ev]{border-left:0!important;border-right:0!important;border-top:1px solid rgba(16,23,40,.15);padding:22px 18px}
    [data-ev-primary]{grid-row:auto}
    .evidence-baseline{grid-template-columns:auto 1fr}
    [data-evidence-meta] .evidence-verdict{justify-content:flex-start}
    [data-hyp-heading]{grid-template-columns:1fr;gap:18px;margin-bottom:22px}
    .hyp-intro{padding-left:16px}
    [data-hyp-meta]{grid-template-columns:1fr}
    [data-hyp-meta]>div{min-height:36px;border-top:1px solid rgba(16,23,40,.12);border-left:0;white-space:normal}
    [data-hyp-meta] .hyp-next-check{justify-content:flex-start}
    [data-hyp]{grid-template-columns:42px minmax(0,1fr)!important;gap:15px;align-items:start;padding:22px 18px 22px 0;min-height:0}
    [data-hyp-rank]{grid-column:1;grid-row:1;height:auto;min-height:80px}
    [data-hyp-summary]{grid-column:2;grid-row:1;padding-right:52px}
    [data-hyp-evidence]{grid-column:1 / -1;grid-row:2;grid-template-columns:1fr!important;margin-left:18px;border-top:1px solid rgba(16,23,40,.12)}
    [data-hyp-detail]{padding:13px 0;border-left:0;border-top:1px solid rgba(16,23,40,.10)}
    [data-hyp-detail]:first-child{border-top:0}
    [data-hyp-score]{position:absolute;right:18px;top:20px;padding:0}
    [data-hyp-score] strong{font-size:28px}
    [data-hyp-score] em{display:none}
  }
</style>
</helmet>
